steps:
  - name: "gcr.io/cloud-builders/docker"
    id: build-api
    args:
      - build
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/travel-agent/api:$COMMIT_SHA
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/travel-agent/api:latest
      - ./apps/api

  - name: "gcr.io/cloud-builders/docker"
    id: push-api
    waitFor: ["build-api"]
    args: [push, --all-tags, us-central1-docker.pkg.dev/$PROJECT_ID/travel-agent/api]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: deploy-api
    waitFor: ["push-api"]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - travel-api
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/travel-agent/api:$COMMIT_SHA
      - --region=us-central1
      - --platform=managed
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=10
      - --port=8080
      - --set-secrets=SERPAPI_KEY=SERPAPI_KEY:latest,ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest
      - --no-allow-unauthenticated

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: public-api
    waitFor: ["deploy-api"]
    entrypoint: gcloud
    args:
      - run
      - services
      - add-iam-policy-binding
      - travel-api
      - --region=us-central1
      - --member=allUsers
      - --role=roles/run.invoker

images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/travel-agent/api:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
