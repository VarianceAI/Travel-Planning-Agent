steps:
  # Build API image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/travel-agent/api:$COMMIT_SHA
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/travel-agent/api:latest
      - ./apps/api

  # Build Web image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/travel-agent/web:$COMMIT_SHA
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/travel-agent/web:latest
      - --build-arg
      - NEXT_PUBLIC_API_URL=https://api-travel-YOUR_HASH-uc.a.run.app
      - ./apps/web

  # Push API image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - push
      - --all-tags
      - us-central1-docker.pkg.dev/$PROJECT_ID/travel-agent/api

  # Push Web image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - push
      - --all-tags
      - us-central1-docker.pkg.dev/$PROJECT_ID/travel-agent/web

  # Deploy API to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - travel-api
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/travel-agent/api:$COMMIT_SHA
      - --region=us-central1
      - --platform=managed
      - --allow-unauthenticated
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=10
      - --set-secrets=SERPAPI_KEY=SERPAPI_KEY:latest,ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest

  # Deploy Web to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - travel-web
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/travel-agent/web:$COMMIT_SHA
      - --region=us-central1
      - --platform=managed
      - --allow-unauthenticated
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=10

images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/travel-agent/api:$COMMIT_SHA
  - us-central1-docker.pkg.dev/$PROJECT_ID/travel-agent/web:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
